[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markup-plus"
version = "0.1.0"
description = "A modern markup language with more features than Markdown"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ataee" }
]
keywords = ["markup", "markdown", "language", "html", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/USERNAME/markup-plus"
Repository = "https://github.com/USERNAME/markup-plus"
Issues = "https://github.com/USERNAME/markup-plus/issues"

[project.scripts]
mup = "markup_plus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"